<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Defenders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="phaser-game"></div>
    </div>

    <div id="password-overlay">
        <h2>ENTER ACCESS CODE</h2>
        <input type="password" id="password-input" placeholder="Password..." autofocus>
        <div id="password-error"></div>
    </div>
    
    <!-- Debug button (temporary) -->
    <button id="debug-btn" style="position: fixed; top: 10px; right: 10px; z-index: 9999; padding: 10px; background: #00ffff; border: none; cursor: pointer;" onclick="
        console.log('=== GAME STATE DEBUG ===');
        console.log('Current Ship:', window.gameState.currentShip);
        console.log('Owned Ships:', window.gameState.ownedShips);
        console.log('LocalStorage:', localStorage.getItem('mathDefendersProgress'));
        alert('Current Ship: ' + window.gameState.currentShip + '\\nCheck console for full debug info');
    ">Debug</button>
    
    <!-- Phaser.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="src/classes/Player.js"></script>
    <script src="src/classes/Enemy.js"></script>
    <script src="src/classes/EquationBlock.js"></script>
    
    <script src="src/scenes/Preloader.js"></script>
    <script src="src/scenes/IntroAnimation.js"></script>
    <script src="src/scenes/MainMenu.js"></script>
    <script src="src/scenes/LevelSelect.js"></script>
    <script src="src/scenes/TutorialScene.js"></script>
    <script src="src/scenes/Game.js"></script>
    <script src="src/scenes/Shop.js"></script>
    <script src="src/scenes/ShipShopScene.js"></script>
    <script src="src/scenes/OutfitShopScene.js"></script>
    <script src="src/scenes/BuddyShopScene.js"></script>
    <script src="src/scenes/WinScene.js"></script>
    <script src="src/scenes/LoseScene.js"></script>
    <script src="src/scenes/UI.js"></script>
    
    <script src="src/main.js"></script>
</body>
</html>
